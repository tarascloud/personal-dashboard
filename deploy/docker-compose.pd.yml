# PD services for Mini server (/opt/docker/)
# Uses external networks from the main docker-compose.yml.
# Redis override: .pd-prod.env has stale Redis config, override via .pd-redis-override.env

networks:
  docker_backend:
    external: true
  docker_frontend:
    external: true

services:
  pd-prod:
    image: pd-prod:latest
    container_name: pd-prod
    restart: unless-stopped
    ports:
      - "8003:3333"
    env_file:
      - /opt/docker/secrets/.pd-prod.env
      - /opt/docker/secrets/.pd-redis-override.env
    environment:
      - NODE_ENV=production
      # Fix: cloudflared "stream canceled by remote with error code 0"
      # Next.js default keepAliveTimeout=5s causes CF to reuse dead connections → CANCEL
      # Set to 120s > cloudflared originRequest.keepAliveTimeout=90s so CF closes idle first
      - KEEP_ALIVE_TIMEOUT=120000
    networks:
      - docker_backend
      - docker_frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pd-dev:
    image: pd-dev:latest
    container_name: pd-dev
    restart: unless-stopped
    ports:
      - "8002:3333"
    env_file:
      - /opt/docker/secrets/.pd-prod.env
      - /opt/docker/secrets/.pd-redis-override.env
    environment:
      - NODE_ENV=production
      # Fix: cloudflared "stream canceled by remote with error code 0"
      # Next.js default keepAliveTimeout=5s causes CF to reuse dead connections → CANCEL
      # Set to 120s > cloudflared originRequest.keepAliveTimeout=90s so CF closes idle first
      - KEEP_ALIVE_TIMEOUT=120000
      - DATABASE_URL=postgresql://pd:pd@pg:5432/pd_dev
      - DIRECT_DATABASE_URL=postgresql://pd:pd@pg:5432/pd_dev
      - NEXTAUTH_URL=https://dev.taras.cloud
    networks:
      - docker_backend
      - docker_frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pd-scheduler:
    build:
      context: ../../
      dockerfile: deploy/pd-Dockerfile
    image: pd-scheduler:latest
    container_name: pd-scheduler
    restart: unless-stopped
    env_file:
      - /opt/docker/secrets/.pd-prod.env
      - /opt/docker/secrets/.pd-redis-override.env
    environment:
      - DB_BACKEND=postgres
      - GARTH_SESSION_DIR=/data/garth_sessions
    volumes:
      - /opt/docker/pd-scheduler/garth_sessions:/data/garth_sessions
    networks:
      - docker_backend
      - docker_frontend
    # CMD: python deploy/scheduler.py (from Dockerfile)

  pd-bot:
    image: pd-scheduler:latest
    container_name: pd-bot
    restart: unless-stopped
    command: python bot.py
    env_file:
      - /opt/docker/secrets/.pd-prod.env
      - /opt/docker/secrets/.pd-redis-override.env
    environment:
      - DB_BACKEND=postgres
      - GARTH_SESSION_DIR=/data/garth_sessions
    volumes:
      - /opt/docker/pd-scheduler/garth_sessions:/data/garth_sessions
    networks:
      - docker_backend
      - docker_frontend
    # Same image as scheduler, different entry point (bot.py)
    # Runs Telegram bot with polling mode
